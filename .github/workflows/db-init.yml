name: DB - Seed Database (one-time)

# Manual trigger only. Safe to accidentally run more than once - the seed
# script checks whether event_ticketing_db.users already exists and skips the
# import if so, rather than failing on duplicate-key errors from schema.sql's
# seed INSERTs.
on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  APP_TAG: assignment-event-ticketing
  SCHEMA_KEY: db-init/schema.sql
  SCRIPT_KEY: db-init/seed-db.sh

jobs:
  seed:
    name: Seed RDS from schema.sql
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Resolve the bucket name from Terraform state rather than hardcoding it,
      # so it stays in sync with the account-ID-suffixed name Terraform created.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Resolve RDS endpoint and S3 bucket from Terraform output
        working-directory: infra/envs/sandbox
        run: |
          terraform init -input=false
          echo "RDS_ENDPOINT=$(terraform output -raw rds_endpoint)" >> "$GITHUB_ENV"
          echo "SCHEMA_BUCKET=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_ENV"

      - name: Upload schema.sql, seed script, and sample images to S3
        run: |
          aws s3 cp event-ticketing/schema.sql "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCHEMA_KEY }}"
          aws s3 cp infra/scripts/seed-db.sh "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCRIPT_KEY }}"
          aws s3 sync event-ticketing/uploads/ "s3://${{ env.SCHEMA_BUCKET }}/uploads/" \
            --exclude "index.html"

      - name: Read DB credentials from SSM Parameter Store and import schema into RDS
        run: |
          set -euo pipefail

          echo "Fetching DB credentials from SSM Parameter Store..."
          aws ssm get-parameter \
            --name assignment-db-credentials \
            --with-decryption \
            --query Parameter.Value \
            --output text > db-creds.json

          python - <<'PY'
          import json
          import subprocess
          
          with open('db-creds.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          host = data['host']
          user = data['username']
          password = data['password']
          dbname = data['dbname']

          with open('/tmp/schema.sql', 'w', encoding='utf-8') as f:
              f.write(open('event-ticketing/schema.sql', 'r', encoding='utf-8').read())

          with open('/tmp/schema.sql', 'r', encoding='utf-8') as schema_file:
              subprocess.run(
                  ["mysql", "-h", host, "-u", user, f"-p{password}", dbname],
                  stdin=schema_file,
                  check=True,
              )

          print('Schema imported into RDS successfully.')
          PY
