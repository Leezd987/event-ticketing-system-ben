name: CD - Deploy Application

# Reusable workflow (workflow_call) - invoked by ci.yml, but also kept
# independently manually runnable (workflow_dispatch). Never auto-triggered on
# push. Deploying always applies infra first (job `infra` below, which calls
# build.yml) so the `app` job never targets instances/an ASG that don't exist
# yet or are out of date - that's the sequencing this workflow guarantees.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: event-ticketing
  ARTIFACT_PREFIX: artifacts
  APP_TAG: assignment-event-ticketing

jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    runs-on: ubuntu-latest
    # Bucket name comes from the infra job's terraform output, not a hardcoded
    # value - keeps this in lockstep with the account-ID-suffixed bucket name.
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install app dependencies (AWS SDK for PHP)
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --optimize-autoloader

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip . -x "uploads/*"

      - name: Upload artifact to S3
        run: |
          aws s3 cp assignment-app.zip \
            "s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip"

      - name: Roll ASG instances to the new application artifact
        run: |
          set -euo pipefail

          ASG_NAME="${{ needs.infra.outputs.asg_name }}"

          if [ -z "$ASG_NAME" ]; then
            echo "No ASG name returned from Terraform apply output."
            exit 1
          fi

          echo "Starting instance refresh for ASG $ASG_NAME..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":300}'

          echo "Waiting for instance refresh to finish..."
          aws autoscaling wait instance-refresh-complete \
            --auto-scaling-group-name "$ASG_NAME"

          echo "ASG instance refresh completed."
